<style>
/* Layout: sticky search band over a wrapping grid of deal tickets; lens chips pick the shopper's situation. */
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --ink: #17192b;
  --muted: #5d6178;
  --line: #dfe2ec;
  --accent: #b9530a;        /* saffron, for prices and actions */
  --accent-ink: #ffffff;
  --marigold: #f4b33c;      /* discount stamp */
  --marigold-ink: #3a2400;
  --peacock: #0d6b70;       /* lens chips */
  --peacock-soft: #e1f1f1;
  --warn: #8a5a00;
  --warn-soft: #fff3d6;
  --info-soft: #eceefa;
  --info: #3b4290;
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101220; --surface: #1a1d30; --ink: #eceef8; --muted: #a2a6bf; --line: #2c3049;
    --accent: #ff9a4d; --accent-ink: #1b0d00; --marigold: #f4b33c; --marigold-ink: #2a1a00;
    --peacock: #6fd0d3; --peacock-soft: #15373a; --warn: #ffcf73; --warn-soft: #3a2d10;
    --info-soft: #252a4a; --info: #b9bff5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101220; --surface: #1a1d30; --ink: #eceef8; --muted: #a2a6bf; --line: #2c3049;
  --accent: #ff9a4d; --accent-ink: #1b0d00; --marigold: #f4b33c; --marigold-ink: #2a1a00;
  --peacock: #6fd0d3; --peacock-soft: #15373a; --warn: #ffcf73; --warn-soft: #3a2d10;
  --info-soft: #252a4a; --info: #b9bff5; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { padding-block: 22px 6px; display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 6vw, 44px); line-height: 1.02; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { padding-block: 10px; display: grid; gap: 10px; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.search input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--peacock); outline-offset: 2px; }

.lenses { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.lenses::-webkit-scrollbar { display: none; }
.lens { flex: none; font: inherit; font-size: 14px; font-weight: 500; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
.lens b { font-weight: 600; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.lens[aria-pressed="true"] { background: var(--peacock); border-color: var(--peacock); color: var(--bg); }
.lens[aria-pressed="true"] b { color: var(--bg); opacity: .8; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }

.lens-note { margin: 14px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--peacock-soft); color: var(--ink); font-size: 14px; max-width: 80ch; }
.lens-note:empty { display: none; }
.count { margin: 14px 0 10px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; padding-bottom: 20px; }
.deal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.deal .name { flex: 1; }
.pic { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; background: #ffffff; display: grid; place-items: center; overflow: hidden; }
.pic img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
.pic .ph { font-family: var(--font-display); font-weight: 800; font-size: 44px; color: var(--line); }
.pic .stamp { position: absolute; top: 8px; left: 8px; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.meta .store { color: var(--ink); }
.findit { font: inherit; font-size: 12.5px; text-align: left; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; }
.findit u { color: var(--accent); font-weight: 600; }
.alltabs { font: inherit; font-size: 14px; font-weight: 600; color: var(--peacock); background: none; border: 0; padding: 0 0 0 6px; cursor: pointer; text-decoration: underline; }
.stamp { flex: none; background: var(--marigold); color: var(--marigold-ink); font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: 0; padding: 3px 8px; border-radius: 8px; text-transform: none; font-variant-numeric: tabular-nums; }
.name { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.price strong { font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--accent); letter-spacing: -.01em; }
.price s { color: var(--muted); font-size: 14px; }
.price .save { font-size: 13px; color: var(--muted); }
.price .tbd { font-size: 14px; color: var(--muted); }
.flags { display: flex; flex-wrap: wrap; gap: 6px; }
.flag { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--info-soft); color: var(--info); font-weight: 500; }
.flag.warn { background: var(--warn-soft); color: var(--warn); }
.actions { display: flex; gap: 8px; align-items: stretch; }
.coupon { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px; font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 10px; border: 1px dashed var(--accent); background: transparent; color: var(--ink); cursor: pointer; }
.coupon code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.coupon span { color: var(--accent); font-weight: 600; flex: none; }
.go { flex: 1; text-align: center; text-decoration: none; font-weight: 600; font-size: 14px; padding: 9px 12px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
.go:hover { filter: brightness(1.08); }

.more { display: block; margin: 0 auto 28px; font: inherit; font-weight: 600; padding: 11px 22px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
footer { border-top: 1px solid var(--line); padding-block: 18px 30px; color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 6px; max-width: 75ch; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .deal { transition: border-color .15s; } .deal:hover { border-color: var(--muted); } }
</style>

</head>
<body>
<header class="top wrap">
  <a class="home-link" href="../">&larr; inJeyneer</a>
  <div class="eyebrow">Black Friday 2026</div>
  <h1>Black Friday deals, <span>sorted for you</span></h1>
  <p class="sub" id="sub">Loading deals…</p>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search">
      <input id="q" type="search" placeholder="Search deals: AirPods, Instant Pot, monitor…" aria-label="Search deals" autocomplete="off">
    </div>
    <div class="lenses" id="lenses" role="group" aria-label="Shop by situation"></div>
    <div class="filters">
      <select id="cat" aria-label="Category"><option value="">All categories</option></select>
      <select id="store" aria-label="Store"><option value="">All stores</option></select>
      <select id="sort" aria-label="Sort">
        <option value="match">Best match</option>
        <option value="pct">Biggest % off</option>
        <option value="save">Most $ saved</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
      </select>
      <label class="toggle"><input type="checkbox" id="coupons"> Has coupon</label>
      <label class="toggle"><input type="checkbox" id="hideold" checked> Hide likely expired</label>
    </div>
  </div>
</div>

<main class="wrap">
  <p class="lens-note" id="note"></p>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Show more deals</button>
</main>

<footer class="wrap">
  <p>Prices change fast on Black Friday. Check the price on the store page before you buy.</p>
  <p>Store links are affiliate links. Buying through them supports this page at no extra cost to you.</p>
  <p id="updated"></p>
</footer>

<script>
const LENSES = [
  { id: "all", label: "All deals", note: "" },
  { id: "under-25", key: "under25", label: "Under $25", note: "Cheap wins: stocking stuffers, office gifts and things for the apartment." },
  { id: "kitchen", key: "kitchen", label: "Indian kitchen", note: "Pressure cookers, Instant Pots, cookware, knives and coffee makers. These are US 110V appliances, built for your kitchen here." },
  { id: "office", key: "office", label: "Home office", note: "Laptops, monitors, keyboards, headphones and chargers for working from home." },
  { id: "family", key: "family", label: "Family & kids", note: "Toys, baby gear and kids' tech." },
  { id: "india-trip", key: "india", label: "Gifts for India trip", note: "Light gifts that pack easily: watches, jewelry, perfume, AirPods, bags and power banks. US plug-in appliances are left out because India runs on 230V. Check India's duty-free baggage limit before you fly." },
  { id: "offers", key: "offers", label: "Phone plans & subscriptions", note: "Lyca Mobile plans, streaming bundles and software offers." },
];
const FLAG = {
  refurb: ["Refurbished / used", "warn"],
  old: ["Posted %d, may be expired", "warn"],
  noprice: ["Price on store page", ""],
  bulky: ["Bulky, hard to move", ""],
  esim: ["US model is eSIM only", ""],
};
const PAGE = 48;
const $ = (id) => document.getElementById(id);
const money = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
let DEALS = [], shown = PAGE, lens = "all";
const IMG = {}, CHUNKS = {};
// Photos ship in chunks of 100; fetch only the chunks the visible cards need, then fill them in.
function loadImages(page) {
  const need = [...new Set(page.map((d) => d.im).filter((n) => n != null && !CHUNKS[n]))];
  need.forEach((n) => {
    CHUNKS[n] = fetch(`img/chunk-${n}.json`).then((r) => r.json()).then((part) => {
      Object.assign(IMG, part);
      document.querySelectorAll(`.pic[data-im="${n}"]`).forEach((el) => {
        const src = IMG[el.dataset.id];
        const ph = el.querySelector(".ph");
        if (src && ph) { const im = new Image(); im.alt = ""; im.src = src; ph.replaceWith(im); }
      });
    }).catch(() => { delete CHUNKS[n]; });
  });
}

function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 1600);
}

const SYN = { tv: "tv|television", headphone: "headphone|headset|earbud|airpod", laptop: "laptop|macbook|notebook|chromebook", phone: "phone|iphone|galaxy|pixel", ssd: "ssd|solid state", watch: "watch|smartwatch", vacuum: "vacuum|roomba", perfume: "perfume|fragrance|eau de|edp|cologne", shoe: "shoe|sneaker|boot", bag: "bag|purse|handbag|tote|crossbody|backpack" };
function terms() {
  return $("q").value.trim().toLowerCase().replace(/[^\p{L}\p{N}\s.+-]/gu, " ").split(/\s+/).filter(Boolean).map((w) => {
    const stem = w.length > 3 && w.endsWith("s") && !w.endsWith("ss") ? w.slice(0, -1) : w;
    const alt = SYN[stem] || stem.replace(/[.+]/g, "\\$&");
    return new RegExp("(^|[^\\p{L}\\p{N}])(" + alt + ")", "iu");
  });
}
// Higher score = the word shows up early in the product name (the thing itself), not in "compatible with ..." at the end.
function score(d, rx) {
  let s = 0;
  for (const r of rx) {
    const m = d._n.match(r);
    if (m) {
      const pos = m.index;
      const cut = d._n.search(/\b(for|compatible|fits|with)\b/);
      s += 10 - Math.min(pos / 15, 7) + (cut === -1 || pos < cut ? 4 : 0);
    } else s += 1; // matched store, category or coupon only
  }
  return s;
}
function baseFilter(d, useLens) {
  const cat = $("cat").value, store = $("store").value;
  const L = LENSES.find((l) => l.id === lens);
  return (!useLens || !L.key || d.l.includes(L.key)) &&
    (!cat || d.k === cat) && (!store || d.s === store) &&
    (!$("hideold").checked || !d.f.includes("old")) && (!$("coupons").checked || d.c);
}
let otherTabs = 0;
function filtered() {
  const rx = terms();
  const hit = (d) => rx.every((r) => r.test(d._t));
  let list = DEALS.filter((d) => baseFilter(d, true) && hit(d));
  otherTabs = rx.length && lens !== "all" ? DEALS.filter((d) => baseFilter(d, false) && hit(d)).length - list.length : 0;
  const sort = $("sort").value;
  if (sort === "match" && rx.length) {
    list.forEach((d) => (d._s = score(d, rx)));
    return list.sort((a, b) => b._s - a._s || (b.o ?? 0) - (a.o ?? 0));
  }
  const val = {
    match: (d) => d.o ?? -1,
    pct: (d) => d.o ?? -1,
    save: (d) => (d.w && d.p != null ? d.w - d.p : -1),
    low: (d) => (d.p == null ? -Infinity : -d.p),
    high: (d) => d.p ?? -1,
  }[sort];
  return list.sort((a, b) => val(b) - val(a));
}

function card(d) {
  const flags = d.f.filter((f) => FLAG[f]).map((f) => {
    const [txt, cls] = FLAG[f];
    return `<span class="flag ${cls}">${esc(txt.replace("%d", d.d))}</span>`;
  }).join("");
  let price;
  if (d.p != null) {
    price = `<strong>${money(d.p)}</strong>` + (d.w ? `<s>${money(d.w)}</s><span class="save">save ${money(Math.round(d.w - d.p))}</span>` : "");
  } else {
    price = `<span class="tbd">${d.k === "Special offers" ? "Special offer" : "See price at store"}</span>`;
  }
  const coupon = d.c ? `<button class="coupon" data-code="${esc(d.c)}" aria-label="Copy coupon ${esc(d.c)}"><code>${esc(d.c)}</code><span>Copy</span></button>` : "";
  const src = IMG[d.id];
  const pic = src ? `<img src="${src}" alt="" loading="lazy">` : `<span class="ph" aria-hidden="true">${esc(d.s.slice(0, 1))}</span>`;
  const home = d.h ? `<button class="findit" data-name="${esc(d.n)}" aria-label="Copy product name">Opens ${esc(d.s)} homepage. <u>Copy name</u> to search there.</button>` : "";
  return `<article class="deal">
    <div class="pic" data-im="${d.im ?? ""}" data-id="${d.id}">${pic}${d.o ? `<span class="stamp">${d.o}% off</span>` : ""}</div>
    <div class="meta"><span class="store">${esc(d.s)}</span><span>${esc(d.k)}</span></div>
    <h2 class="name" title="${esc(d.n)}">${esc(d.n)}</h2>
    <div class="price">${price}</div>
    ${flags ? `<div class="flags">${flags}</div>` : ""}
    ${home}
    <div class="actions">${coupon}<a class="go" href="${esc(d.u)}" target="_blank" rel="noopener sponsored">${d.h ? "Shop at " + esc(d.s) : "Get deal"}</a></div>
  </article>`;
}

function render() {
  const list = filtered();
  const L = LENSES.find((l) => l.id === lens);
  $("note").textContent = L.note;
  $("count").innerHTML = (list.length ? `${list.length.toLocaleString()} deals` + (list.length > shown ? `, showing ${shown}` : "") : "") +
    (otherTabs > 0 ? ` <button class="alltabs" id="alltabs">+${otherTabs} more in All deals</button>` : "");
  const page = list.slice(0, shown);
  $("grid").innerHTML = list.length ? page.map(card).join("") : `<div class="empty">No deals match in this tab. Try All deals, a different word, or clear a filter.</div>`;
  $("more").hidden = list.length <= shown;
  loadImages(page);
  document.querySelectorAll(".lens").forEach((b) => b.setAttribute("aria-pressed", b.dataset.id === lens));
}

function setLens(id, push) {
  lens = LENSES.some((l) => l.id === id) ? id : "all";
  shown = PAGE;
  if (push) history.replaceState(null, "", lens === "all" ? location.pathname + location.search : "#" + lens);
  save("anlf-lens", lens);
  render();
}

function init(data) {
  DEALS = data.deals.map((d) => ({ ...d, _t: (d.n + " " + d.s + " " + d.k + " " + d.c).toLowerCase() }));
  const stores = {}, cats = {};
  DEALS.forEach((d) => { stores[d.s] = (stores[d.s] || 0) + 1; cats[d.k] = (cats[d.k] || 0) + 1; });
  Object.keys(cats).sort().forEach((c) => $("cat").insertAdjacentHTML("beforeend", `<option value="${esc(c)}">${esc(c)} (${cats[c]})</option>`));
  Object.entries(stores).sort((a, b) => b[1] - a[1]).forEach(([s, n]) => $("store").insertAdjacentHTML("beforeend", `<option value="${esc(s)}">${esc(s)} (${n})</option>`));
  $("lenses").innerHTML = LENSES.map((l) => {
    const n = l.key ? DEALS.filter((d) => d.l.includes(l.key)).length : DEALS.length;
    return `<button class="lens" data-id="${l.id}" aria-pressed="false">${l.label}<b>${n.toLocaleString()}</b></button>`;
  }).join("");
  const pcts = DEALS.map((d) => d.o).filter(Boolean).sort((a, b) => a - b);
  $("sub").textContent = `${DEALS.length.toLocaleString()} deals from Amazon, Best Buy, Macy's, Walmart and more. Typical discount ${pcts[pcts.length >> 1]}% off. Pick what you're shopping for below.`;
  $("updated").textContent = `Deals list updated ${data.updated}.`;
  const start = location.hash.slice(1) || load("anlf-lens") || "all";
  setLens(start, false);
}

$("lenses").addEventListener("click", (e) => { const b = e.target.closest(".lens"); if (b) setLens(b.dataset.id, true); });
["q", "cat", "store", "sort", "hideold", "coupons"].forEach((id) => $(id).addEventListener(id === "q" ? "input" : "change", () => { shown = PAGE; render(); }));
$("more").addEventListener("click", () => { shown += PAGE; render(); });
window.addEventListener("hashchange", () => setLens(location.hash.slice(1) || "all", false));
$("count").addEventListener("click", (e) => { if (e.target.id === "alltabs") setLens("all", true); });
$("q").addEventListener("input", () => { if ($("q").value.trim() && $("sort").value !== "match" && !$("sort").dataset.touched) { $("sort").value = "match"; render(); } });
$("sort").addEventListener("change", () => { $("sort").dataset.touched = "1"; });
$("grid").addEventListener("click", (e) => {
  const f = e.target.closest(".findit");
  if (f) {
    const name = f.dataset.name;
    if (navigator.clipboard) navigator.clipboard.writeText(name).then(() => toast("Name copied. Paste it in the store's search."), () => toast("Couldn't copy. Long-press the name to copy it."));
    return;
  }
  const b = e.target.closest(".coupon"); if (!b) return;
  const code = b.dataset.code;
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.querySelector("code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Code selected. Copy it from here."); };
  if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => toast(`Copied ${code}`), fallback); else fallback();
});

fetch("deals.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(init).catch(() => {
  $("sub").textContent = "The deals list didn't load. Refresh the page to try again.";
});
</script>

</body>
</html>
