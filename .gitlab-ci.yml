# GitLab Pages CI/CD configuration
# Deploys inJeyneer static site to GitLab Pages for free

image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p .public
    - cp -r index.html styles.css main.js assets guides about .public/
    - rm -rf public
    - mv .public public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
